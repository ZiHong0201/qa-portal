# ---------------------------------------------------------------------------
# lesson-archiver configuration
#
# Copy to config.yaml and edit. Secrets do NOT live here - they go in .env.
#   cp config.example.yaml config.yaml
#   cp .env.example .env
# ---------------------------------------------------------------------------

timezone: Asia/Kuala_Lumpur

zoom:
  # Look this far back when polling. Generous, because state.db de-duplicates.
  lookback_days: 3
  # Zoom keeps cloud recordings until we remove them. "trash" is recoverable
  # from Zoom's trash for 30 days; "delete" is permanent. Keep "trash".
  delete_action: trash
  # Never remove from Zoom unless the Drive copy verified byte-for-byte.
  delete_after_archive: true
  # Warn when Zoom cloud storage crosses this fraction of the plan allowance.
  # Zoom Workplace Pro includes 10 GB; a stalled pipeline silently fills it
  # and then Zoom stops recording altogether.
  storage_warn_fraction: 0.6
  plan_storage_gb: 10

calendar:
  # "caldav" (recommended) or "ics" (published-calendar URL, no credentials)
  source: caldav
  # Read ONLY this calendar. Make a dedicated one in Calendar.app so a leaked
  # credential never exposes your personal schedule.
  calendar_name: Teaching
  # A recording is joined to the event with the largest time overlap.
  match_tolerance_minutes: 20
  # If the two best-matching events score within this margin of each other the
  # match is called ambiguous and the lesson is routed for review instead.
  ambiguity_margin: 0.10

transcript:
  # Zoom generates a VTT transcript for cloud recordings at no extra cost.
  # Enable it first:  Zoom Settings > Recording > Cloud recording >
  #                   "Create audio transcript"
  prefer_zoom_vtt: true
  # Local ASR fallback used only when the VTT is missing or too short.
  whisper_fallback: true
  whisper_model: small
  # Below this many characters the VTT is treated as unusable.
  min_usable_chars: 400
  # Tokens are money and full transcripts add little over a good sample.
  sample:
    head_minutes: 10
    chunk_count: 3
    chunk_minutes: 2

classify:
  # "api"         - Anthropic API key in .env (works unattended, ~$1/month)
  # "claude-code" - shells out to `claude -p`, uses your Claude subscription
  #                 instead of API billing. Requires the Claude Code CLI to be
  #                 installed and logged in as the user running this agent.
  backend: api
  model: claude-opus-5
  # Route to the final folder only at or above this confidence.
  auto_file_threshold: 0.85
  # Below this, the lesson is treated as unidentified.
  review_threshold: 0.60

drive:
  # Folder tree is created under this name in My Drive.
  root_folder_name: Teaching Archive
  # Optional: pin to an existing folder instead. If you set this, also switch
  # oauth_scope to "drive" - the narrow "drive.file" scope cannot see folders
  # this app did not create.
  root_folder_id: null
  oauth_scope: drive.file
  # Subject folders. Recordings whose subject is not listed here still get
  # archived, under the subject name as given.
  subjects:
    Physics:
      forms: ["Form 4", "Form 5"]
  review_folder: _Review
  unsorted_folder: _Unsorted

# The archive target you asked for. Everything else is filed too, but only
# these rows are treated as "expected" by the nightly reconciliation check.
watch:
  - subject: Physics
    form: Form 5

# Chapter names used for folder naming and to constrain the classifier.
# CHECK THESE against your own scheme of work and edit freely - an unlisted
# chapter is not an error, it just files under "Unsorted-Chapter".
syllabus:
  Physics:
    Form 4:
      - "Ch01 - Measurement"
      - "Ch02 - Force and Motion I"
      - "Ch03 - Gravitation"
      - "Ch04 - Heat"
      - "Ch05 - Waves"
    Form 5:
      - "Ch01 - Force and Motion II"
      - "Ch02 - Pressure"
      - "Ch03 - Electricity and Magnetism"
      - "Ch04 - Electronics"
      - "Ch05 - Nuclear Physics"
      - "Ch06 - Quantum Physics"

retention:
  # Keep full video this long, then keep audio + transcript only. Audio is
  # roughly 4% of the video size, so this is what makes 400 GB last.
  video_months: 12
  # Recordings with no teaching event behind them (staff meetings, parent
  # calls) never have their video downloaded; audio is kept this long.
  unmatched_audio_days: 30

notify:
  # "telegram" (free, reaches your phone) or "macos" (local banner) or "none"
  backend: telegram
  # One message per lesson, edited in place through the stages, instead of
  # four separate pings.
  edit_in_place: true

runtime:
  work_dir: ./work
  state_db: ./state.db
  max_attempts: 4
  # Skip the video download entirely for anything not matching `watch`.
  # Set false to archive every subject's video.
  video_for_watched_only: false
