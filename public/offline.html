<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Mr Tan Exercise Portal</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: linear-gradient(120deg, #e0f2fe, #ede9fe, #dbeafe);
        font-family: Arial, Helvetica, sans-serif;
        color: #0f172a;
      }
      .card {
        max-width: 22rem;
        width: 100%;
        text-align: center;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 20px;
        padding: 32px 24px;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
      }
      img {
        width: 84px;
        height: 84px;
        border-radius: 22px;
        display: block;
        margin: 0 auto 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
      }
      p {
        margin: 0;
        color: #475569;
        font-size: 0.95rem;
        line-height: 1.5;
      }
      button {
        margin-top: 20px;
        border: 0;
        border-radius: 12px;
        padding: 10px 22px;
        font-size: 0.95rem;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(to right, #0284c7, #4f46e5);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        The portal needs a connection to load question sets and marks. Check your
        signal and try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
